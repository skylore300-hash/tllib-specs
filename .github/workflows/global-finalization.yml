name: Global finalization validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'maths/**'
      - 'framework/**'
      - 'registry/**'
      - 'handoff/**'
      - 'reports/**'
      - 'execution-manifests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.lock'
      - '.python-version'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'maths/**'
      - 'framework/**'
      - 'registry/**'
      - 'handoff/**'
      - 'reports/**'
      - 'execution-manifests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.lock'
      - '.python-version'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  catalog:
    name: Resolve canonical catalog population
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.population.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Validate workflow trigger coverage
        run: python tools/pipeline/validate_ci_triggers.py
      - name: Validate repository tracked-file hygiene
        run: python tools/pipeline/validate_repository_hygiene.py
      - name: Prove catalog-driven matrix evolution
        run: python tools/pipeline/catalog_snapshot.py --self-test
      - name: Resolve catalog population and commit evidence
        id: population
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python tools/pipeline/catalog_snapshot.py --matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          python tools/pipeline/catalog_snapshot.py --output pipeline-evidence.json
          cat pipeline-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload commit-pinned publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: global-finalization-evidence-${{ github.sha }}
          path: pipeline-evidence.json
          if-no-files-found: error

  domain:
    name: Domain ${{ matrix.domain }}
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Check published domain artifact parity
        env:
          DOMAIN: ${{ matrix.domain }}
          EXPECTED: ${{ matrix.count }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          domain = os.environ['DOMAIN']
          expected = int(os.environ['EXPECTED'])
          roots = {
              'ir': (Path('registry/optimized-ir') / domain, 'ir.yaml'),
              'algorithm': (Path('registry/algorithms') / domain, 'algorithm.yaml'),
              'oracle': (Path('registry/oracles') / domain, 'oracle.yaml'),
          }
          sets = {}
          for kind, (root, filename) in roots.items():
              files = sorted(root.glob(f'*/{filename}'))
              observed = len(files)
              if observed != expected:
                  raise SystemExit(f'{domain} {kind}: expected={expected}, observed={observed}')
              sets[kind] = {path.parent.name for path in files}
          if sets['ir'] != sets['algorithm'] or sets['ir'] != sets['oracle']:
              raise SystemExit(f'{domain}: IR/algorithm/oracle feature populations differ')

          required = [
              'manifest.yaml',
              'feature-status.yaml',
              'patterns.yaml',
              'module-specification.yaml',
              'implementation-tasks.yaml',
          ]
          missing = [
              name for name in required
              if not (Path('registry/domain-finalization') / domain / name).is_file()
          ]
          if missing:
              raise SystemExit(f'{domain}: missing finalization artifacts {missing}')

          catalog = json.loads((Path('handoff/domains') / domain / 'catalog.json').read_text(encoding='utf-8'))
          ordered = catalog.get('ordered_feature_ids')
          if not isinstance(ordered, list) or len(ordered) != expected:
              raise SystemExit(
                  f'{domain} handoff catalog: expected={expected}, observed={len(ordered) if isinstance(ordered, list) else "invalid"}'
              )
          if set(ordered) != sets['ir']:
              raise SystemExit(f'{domain}: handoff and finalized artifact populations differ')
          print(f'{domain}: PASS ({expected} catalog-derived features)')
          PY

  global:
    name: Global integrity
    needs: [catalog, domain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install locked validator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet --no-deps -r requirements.lock
          python -m pip check
          python tools/pipeline/validate_python_environment.py
      - name: Validate repository tracked-file hygiene
        run: python tools/pipeline/validate_repository_hygiene.py
      - name: Verify canonical catalog reconstruction
        run: python tools/handoff/generate_catalog.py --check
      - name: Validate integrated package
        run: python tools/global-finalization/validate_global_finalization.py
      - name: Verify validation leaves checkout clean
        shell: bash
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo 'Validation dirtied the checkout.' >&2
            exit 1
          fi
