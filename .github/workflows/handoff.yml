name: Feature handoff validation

on:
  pull_request:
    branches: [main, handoff/integration-v1]
    paths:
      - 'maths/**'
      - 'framework/**'
      - 'registry/**'
      - 'handoff/**'
      - 'reports/**'
      - 'execution-manifests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.lock'
      - '.python-version'
      - '.gitignore'
  push:
    branches: [main, handoff/integration-v1]
    paths:
      - 'maths/**'
      - 'framework/**'
      - 'registry/**'
      - 'handoff/**'
      - 'reports/**'
      - 'execution-manifests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.lock'
      - '.python-version'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: Validate finalized handoff v1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install locked validator dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet --no-deps -r requirements.lock
          python -m pip check
          python tools/pipeline/validate_python_environment.py
      - name: Validate repository tracked-file hygiene
        run: python tools/pipeline/validate_repository_hygiene.py
      - name: Validate publication workflow trigger coverage
        run: python tools/pipeline/validate_ci_triggers.py
      - name: Verify deterministic global catalog
        run: python tools/handoff/generate_catalog.py --check
      - name: Audit semantic governance and shared contract closures
        shell: bash
        run: |
          python tools/pipeline/validate_semantic_contract_governance.py --evidence "$RUNNER_TEMP/wave-c-evidence.json"
          python tools/pipeline/validate_semantic_contract_governance.py --evidence "$RUNNER_TEMP/wave-c-evidence-repeat.json"
          cmp "$RUNNER_TEMP/wave-c-evidence.json" "$RUNNER_TEMP/wave-c-evidence-repeat.json"
      - name: Validate published domains and feature packages
        id: validate
        shell: bash
        run: |
          set +e
          output="$(python tools/handoff/validate_handoff.py 2>&1)"
          status=$?
          printf '%s\n' "$output" | tee handoff-validation.log
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s\n' "$output" | tail -n 1 | tr -cs '[:alnum:]_.-' '-' | cut -c1-120)"
            printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
      - name: Run finalized validation logical scenarios
        run: python tools/handoff/validate_handoff.py --self-test
      - name: Prove catalog-driven matrix evolution
        run: python tools/pipeline/catalog_snapshot.py --self-test
      - name: Validate domains 16-35 extension publication
        run: python tools/domain-progress/validate_extension_16_35.py
      - name: Validate standalone consumer acceptance and determinism
        shell: bash
        run: |
          python tools/pipeline/validate_consumer_acceptance.py --self-test
          python tools/pipeline/validate_consumer_acceptance.py --evidence "$RUNNER_TEMP/wave-d-consumer.json"
          python tools/pipeline/validate_consumer_acceptance.py --evidence "$RUNNER_TEMP/wave-d-consumer-repeat.json"
          cmp "$RUNNER_TEMP/wave-d-consumer.json" "$RUNNER_TEMP/wave-d-consumer-repeat.json"
      - name: Validate catalog compatibility and migration diff
        shell: bash
        run: |
          python tools/pipeline/validate_catalog_compatibility.py --self-test
          python tools/pipeline/validate_catalog_compatibility.py --evidence "$RUNNER_TEMP/wave-d-compatibility.json"
          python tools/pipeline/validate_catalog_compatibility.py --evidence "$RUNNER_TEMP/wave-d-compatibility-repeat.json"
          cmp "$RUNNER_TEMP/wave-d-compatibility.json" "$RUNNER_TEMP/wave-d-compatibility-repeat.json"
      - name: Reject committed bundle archives
        shell: bash
        run: |
          if find handoff -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \) -print -quit | grep -q .; then
            echo 'Committed bundle archive found under handoff/.' >&2
            exit 1
          fi
      - name: Verify validation leaves checkout clean
        shell: bash
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo 'Validation dirtied the checkout.' >&2
            exit 1
          fi
      - name: Upload Wave C governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-c-governance-${{ github.sha }}
          path: ${{ runner.temp }}/wave-c-evidence.json
          if-no-files-found: ignore
      - name: Upload Wave D consumer and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-d-consumer-versioning-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wave-d-consumer.json
            ${{ runner.temp }}/wave-d-compatibility.json
          if-no-files-found: ignore
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-validation-${{ steps.validate.outputs.diagnostic || 'non-validator-failure' }}
          path: handoff-validation.log
          if-no-files-found: ignore
