schema_version: 1
artifact_kind: theorems_algorithm_specification
feature_id: TLC-FC-06-THEOREMS-005
operation: register_cns_operator_claims
signature: register_cns_operator_claims(OpaqueTransformationClaim transformation_claim, Mapping<DimensionId,OpaqueRemovalEffectClaim> dimension_removal_claims) -> CNSOperatorClaimSet
inputs:
  - {name: transformation_claim, type: OpaqueTransformationClaim}
  - {name: dimension_removal_claims, type: "Mapping<DimensionId,OpaqueRemovalEffectClaim>"}
outputs:
  - {name: cns_operator_claims, type: CNSOperatorClaimSet}
validations:
  - transformation_claim is present and cites lines 54-55
  - every removal claim cites lines 66-67
  - transformation and removal claim families are not conflated
hypotheses:
  - TLC-EA-THEOREMS-005-001 is retained
preconditions:
  - The transformation claim cites lines 54-55 and every removal claim cites lines 66-67.
conditions_of_application:
  - claims are registered as opaque source claims only
ordered_steps:
  - validate transformation claim presence and source
  - validate every removal claim source
  - validate claim-family separation
  - preserve all opaque claim payloads
  - construct claim set with two addressable families
  - validate blocked-local status
branching:
  - {condition: transformation claim missing, result: MISSING_TRANSFORMATION_CLAIM}
  - {condition: any removal claim source missing, result: MISSING_REMOVAL_CLAIM_SOURCE}
  - {condition: claim families collide, result: CLAIM_FAMILY_COLLISION}
  - {condition: all validations pass, result: return cns_operator_claims}
dependencies: [DEP-THEOREMS-HUIT-001, RESULT-THEOREMS-003, PROOF-THEOREMS-003]
statement_handling:
  construction: separated_opaque_claim_families
  scientific_validation: none
proof_status_control:
  specification_metadata: partial_not_formalized_with_PROOF-THEOREMS-003
  runtime_truth_value_returned: false
errors: [MISSING_TRANSFORMATION_CLAIM, MISSING_REMOVAL_CLAIM_SOURCE, CLAIM_FAMILY_COLLISION]
postconditions:
  - transformation and removal-effect claims remain separately addressable
  - blocked-local scientific status is preserved
determinism: identical claims produce an identical claim set
edge_cases:
  - absence of a scientific definition for a removal effect does not prevent opaque registration
  - identical payloads in different claim families are not merged
unresolved_conserved: []
pseudocode: |
  function register_cns_operator_claims(transformation_claim, dimension_removal_claims):
      if transformation_claim is missing:
          raise MISSING_TRANSFORMATION_CLAIM
      if source_reference(transformation_claim) != "maths/06-theorems/theorems.md:54-55":
          raise MISSING_TRANSFORMATION_CLAIM
      if any removal claim lacks source "maths/06-theorems/theorems.md:66-67":
          raise MISSING_REMOVAL_CLAIM_SOURCE
      if transformation_claim is stored in the removal family or a removal claim is stored as transformation:
          raise CLAIM_FAMILY_COLLISION
      result = CNSOperatorClaimSet(
          transformation_claim = preserve_identity(transformation_claim),
          dimension_removal_claims = preserve_mapping(dimension_removal_claims),
          scientific_status = "blocked_local"
      )
      assert result keeps the two families separately addressable
      return result
forbidden_operations:
  - execute a removal effect
  - establish completeness
  - establish necessity
  - establish sufficiency
  - infer scientific equivalence
