schema_version: 1
artifact_kind: theorems_algorithm_specification
feature_id: TLC-FC-06-THEOREMS-009
operation: construct_principles_role_descriptor
signature: construct_principles_role_descriptor(OpaqueDimensionRole principles_role, SourceOrdinal source_ordinal) -> PrinciplesRoleDescriptor
inputs:
  - {name: principles_role, type: OpaqueDimensionRole}
  - {name: source_ordinal, type: SourceOrdinal}
outputs:
  - {name: principles_descriptor, type: PrinciplesRoleDescriptor}
validations:
  - role label is Principles
  - source ordinal equals 2
  - role cites maths/06-theorems/theorems.md:82
  - TLC-UT-THEOREMS-006 is attached
hypotheses:
  - TLC-EA-THEOREMS-009-001 is retained
  - Principles classification and rational coherence remain opaque
preconditions:
  - The supplied role cites line 82 and carries unresolved identifier TLC-UT-THEOREMS-006.
conditions_of_application:
  - descriptor applies only to the isolated Principles source role
ordered_steps:
  - validate role label
  - validate source ordinal and line-82 source position
  - validate unresolved attachment
  - preserve opaque role payload
  - construct Principles descriptor
  - validate postcondition
branching:
  - {condition: label is not Principles, result: WRONG_DIMENSION_LABEL}
  - {condition: ordinal is not 2 or source reference is not line 82, result: WRONG_SOURCE_ORDINAL}
  - {condition: TLC-UT-THEOREMS-006 is absent, result: MISSING_PRINCIPLES_UNRESOLVED}
  - {condition: all validations pass, result: return principles_descriptor}
dependencies: [DEP-THEOREMS-HUIT-001, DEP-THEOREMS-PRINCIPLE-001, RESULT-THEOREMS-003, PROOF-THEOREMS-003]
statement_handling:
  construction: isolated_opaque_role_descriptor
  coherence_validation: none
proof_status_control:
  specification_metadata: partial_not_formalized_with_PROOF-THEOREMS-003
  runtime_truth_value_returned: false
errors: [WRONG_DIMENSION_LABEL, WRONG_SOURCE_ORDINAL, MISSING_PRINCIPLES_UNRESOLVED]
postconditions:
  - descriptor is labelled Principles
  - ordinal 2, opaque payload, and TLC-UT-THEOREMS-006 are preserved
determinism: identical inputs produce an identical descriptor
edge_cases:
  - rational coherence text is preserved only as an opaque source label
  - a semantically similar non-Principles label is rejected rather than normalized
unresolved_conserved: [TLC-UT-THEOREMS-006]
pseudocode: |
  function construct_principles_role_descriptor(principles_role, source_ordinal):
      if label(principles_role) != "Principles":
          raise WRONG_DIMENSION_LABEL
      if source_ordinal != 2 or source_reference(principles_role) != "maths/06-theorems/theorems.md:82":
          raise WRONG_SOURCE_ORDINAL
      if unresolved_ids(principles_role) does not contain "TLC-UT-THEOREMS-006":
          raise MISSING_PRINCIPLES_UNRESOLVED
      result = PrinciplesRoleDescriptor(
          label = "Principles",
          source_ordinal = 2,
          role = preserve_identity(principles_role),
          unresolved_id = "TLC-UT-THEOREMS-006"
      )
      assert result preserves label, ordinal, role, and unresolved identifier
      return result
forbidden_operations:
  - define rational coherence
  - resolve the Principles classification
  - infer sufficiency
  - prove the CNS theorem
