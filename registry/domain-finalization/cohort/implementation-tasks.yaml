schema_version: 1
domain: cohort
status: ready_for_future_developer_assignment
rules:
  - use each feature mathematical contract as scientific authority after cohort.md
  - use finalized IR algorithm specification and oracle without inventing missing science
  - preserve opaque calibration values unresolved items and non-execution guards
  - do not choose a runtime framework C++ design Python binding numerical integrator PDE solver optimizer or training method in this specification repository
shared_tasks:
  - task_id: COHORT-TASK-SHARED-001
    title: Build shared source-faithful Cohort descriptor and opaque-value carriers
    acceptance: [feature identity and traceability are lossless, opaque scientific values are not calibrated, unresolved items remain enumerable]
  - task_id: COHORT-TASK-SHARED-002
    title: Build common Cohort validation and structured-error handling
    depends_on: [COHORT-TASK-SHARED-001]
    acceptance: [validation is deterministic, no partial result is published on validation failure, error codes remain transport neutral]
  - task_id: COHORT-TASK-SHARED-003
    title: Build non-execution guards for unresolved scientific evaluators
    depends_on: [COHORT-TASK-SHARED-001, COHORT-TASK-SHARED-002]
    acceptance: [type-geometry PDE and robustness evaluation requests fail with their declared external-provider errors]
