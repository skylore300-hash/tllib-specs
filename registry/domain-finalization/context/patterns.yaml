schema_version: 1
domain: context
status: selected_for_implementation_specification
patterns:
  - pattern_id: CONTEXT-PAT-001
    name: opaque_context_structure_carriage
    applies_to: [TLC-FC-24-CONTEXT-001, TLC-FC-24-CONTEXT-002, TLC-FC-24-CONTEXT-004, TLC-FC-24-CONTEXT-005, TLC-FC-24-CONTEXT-006, TLC-FC-24-CONTEXT-007, TLC-FC-24-CONTEXT-008, TLC-FC-24-CONTEXT-010, TLC-FC-24-CONTEXT-011, TLC-FC-24-CONTEXT-012]
    rule: Source states coefficients gradients provider values capacities and cultural or symbolic internals remain caller supplied or opaque when the source gives no construction.
  - pattern_id: CONTEXT-PAT-002
    name: raw_tensor_without_metric_completion
    applies_to: [TLC-FC-24-CONTEXT-002, TLC-FC-24-CONTEXT-003]
    rule: Preserve the exact written i<j tensor orientation and never add symmetric counterparts positivity conditions or SPD completion.
  - pattern_id: CONTEXT-PAT-003
    name: structural_non_execution_guard
    applies_to: [TLC-FC-24-CONTEXT-003]
    rule: True contextual distance remains non-executable locally until external differentiable-structure metric-validity and distance-provider evidence is supplied.
  - pattern_id: CONTEXT-PAT-004
    name: dynamics_without_solver
    applies_to: [TLC-FC-24-CONTEXT-004, TLC-FC-24-CONTEXT-005, TLC-FC-24-CONTEXT-008]
    rule: Evaluate only source right-hand sides or the guarded announced derivative formula; choose no ODE solver optimizer matrix inversion or differentiation method.
  - pattern_id: CONTEXT-PAT-005
    name: externally_supplied_derivatives_and_norms
    applies_to: [TLC-FC-24-CONTEXT-006, TLC-FC-24-CONTEXT-007, TLC-FC-24-CONTEXT-008, TLC-FC-24-CONTEXT-011]
    rule: Derivatives of H and X star and all compatible norms are external scientific values or providers; no finite differences automatic differentiation or default norm is inferred.
  - pattern_id: CONTEXT-PAT-006
    name: contradiction_preservation
    applies_to: [TLC-FC-24-CONTEXT-009]
    rule: Preserve P_ctx exactly as J(X,c)/J(X_star(c),c); never clamp invert normalize or certify the source [0,1] claim.
  - pattern_id: CONTEXT-PAT-007
    name: external_threshold_and_extremum_evidence
    applies_to: [TLC-FC-24-CONTEXT-010, TLC-FC-24-CONTEXT-012]
    rule: Global maximum distance and system capacity must be externally established; no compactness maximum search calibration or default threshold is invented.
  - pattern_id: CONTEXT-PAT-008
    name: culture_downstream_without_cycle
    applies_to: [TLC-FC-24-CONTEXT-001]
    rule: Culture may explain C_cultural and C_symbolic but remains an analysis companion and downstream Context consumer rather than a Context runtime provider.
  - pattern_id: CONTEXT-PAT-009
    name: no_silent_scientific_completion
    applies_to: [TLC-FC-24-CONTEXT-001, TLC-FC-24-CONTEXT-002, TLC-FC-24-CONTEXT-003, TLC-FC-24-CONTEXT-004, TLC-FC-24-CONTEXT-005, TLC-FC-24-CONTEXT-006, TLC-FC-24-CONTEXT-007, TLC-FC-24-CONTEXT-008, TLC-FC-24-CONTEXT-009, TLC-FC-24-CONTEXT-010, TLC-FC-24-CONTEXT-011, TLC-FC-24-CONTEXT-012]
    rule: Every unresolved structure typing theorem link derivative extremum range contradiction and threshold remains explicit and cannot become a default behavior.
