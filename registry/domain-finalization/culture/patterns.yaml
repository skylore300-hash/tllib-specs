schema_version: 1
domain: culture
status: selected_for_implementation_specification
patterns:
  - pattern_id: CULTURE-PAT-001
    name: context_as_scientific_authority
    applies_to: [TLC-FC-25-CULTURE-001, TLC-FC-25-CULTURE-003, TLC-FC-25-CULTURE-004, TLC-FC-25-CULTURE-005, TLC-FC-25-CULTURE-006]
    rule: Context owns C, g_c, the general weight law, S_contexte, and A_contexte; Culture references or delegates to them without autonomous redefinition.
  - pattern_id: CULTURE-PAT-002
    name: qualitative_objects_remain_opaque
    applies_to: [TLC-FC-25-CULTURE-001, TLC-FC-25-CULTURE-002, TLC-FC-25-CULTURE-005, TLC-FC-25-CULTURE-007, TLC-FC-25-CULTURE-008]
    rule: Cultural and symbolic objects, influence surfaces, classification evidence, and fidelity evidence remain opaque unless the source supplies a quantitative construction.
  - pattern_id: CULTURE-PAT-003
    name: structural_non_execution_guards
    applies_to: [TLC-FC-25-CULTURE-005, TLC-FC-25-CULTURE-008]
    rule: No robust/plastic or failure-mode label is computed locally without external scientific evidence because the source supplies no threshold or detector.
  - pattern_id: CULTURE-PAT-004
    name: context_provider_delegation
    applies_to: [TLC-FC-25-CULTURE-004, TLC-FC-25-CULTURE-006]
    rule: Conditional execution uses caller-supplied providers conforming to the cited Context feature and never imports or reimplements a Context runtime package.
  - pattern_id: CULTURE-PAT-005
    name: no_quantitative_core_guarantee
    applies_to: [TLC-FC-25-CULTURE-007]
    rule: The strong-J-penalty preservation statement remains qualitative; no radius penalty floor or numeric guarantee is inferred.
  - pattern_id: CULTURE-PAT-006
    name: no_mention_only_dependencies
    applies_to: [TLC-FC-25-CULTURE-002, TLC-FC-25-CULTURE-005]
    rule: Message Principles Values Competencies Practices and invariants remain references unless a provider role is explicitly sourced.
  - pattern_id: CULTURE-PAT-007
    name: no_silent_scientific_completion
    applies_to: [TLC-FC-25-CULTURE-001, TLC-FC-25-CULTURE-002, TLC-FC-25-CULTURE-003, TLC-FC-25-CULTURE-004, TLC-FC-25-CULTURE-005, TLC-FC-25-CULTURE-006, TLC-FC-25-CULTURE-007, TLC-FC-25-CULTURE-008]
    rule: Missing coordinates thresholds mappings detectors neighborhood bounds and penalty coefficients never become defaults.
