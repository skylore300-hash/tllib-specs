module_invariants:
  - No threshold or coefficient is calibrated locally.
  - Undefined norms sigma projections gradients derivatives integrals expectations distributions normalizers references and statistics remain provider-backed.
  - M_r remains present in integrated progression and no m_r_j family is invented.
  - E_community remains source-undefined unless an external value is supplied.
  - Empty peer population is a structured error with no numeric fallback.
  - Source weights are never silently renormalized or projected.
  - Fairness-specific distributive mechanisms and Regulation behavior remain outside Evaluation runtime.
  - No numerical solver integrator optimizer or state machine is part of this handoff.
non_goals: [runtime implementation, C++ implementation, Python binding, numerical integration, numerical differentiation, optimizer, simplex solver, Markov process, promotion engine, distributive justice engine, Regulation implementation]
