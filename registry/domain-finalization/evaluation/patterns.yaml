schema_version: 1
domain: evaluation
patterns:
  - id: provider-backed-source-expression
    applies_to: [TLC-FC-18-EVALUATION-001, TLC-FC-18-EVALUATION-002, TLC-FC-18-EVALUATION-003, TLC-FC-18-EVALUATION-004, TLC-FC-18-EVALUATION-005, TLC-FC-18-EVALUATION-006, TLC-FC-18-EVALUATION-007, TLC-FC-18-EVALUATION-008, TLC-FC-18-EVALUATION-009, TLC-FC-18-EVALUATION-010, TLC-FC-18-EVALUATION-011, TLC-FC-18-EVALUATION-012, TLC-FC-18-EVALUATION-013, TLC-FC-18-EVALUATION-014, TLC-FC-18-EVALUATION-015, TLC-FC-18-EVALUATION-017, TLC-FC-18-EVALUATION-018]
    rule: A source expression is evaluable only when every undefined norm sigma integral derivative gradient projection expectation normalizer reference or statistic is supplied as an input/provider.
  - id: no-numerical-method-invention
    applies_to: [TLC-FC-18-EVALUATION-002, TLC-FC-18-EVALUATION-004, TLC-FC-18-EVALUATION-006, TLC-FC-18-EVALUATION-008, TLC-FC-18-EVALUATION-010, TLC-FC-18-EVALUATION-014]
    rule: Preserve integrals derivatives gradients and RHS expressions without inventing quadrature finite differences optimization or time integration.
  - id: denominator-guard
    applies_to: [TLC-FC-18-EVALUATION-002, TLC-FC-18-EVALUATION-003, TLC-FC-18-EVALUATION-004, TLC-FC-18-EVALUATION-005, TLC-FC-18-EVALUATION-011, TLC-FC-18-EVALUATION-015, TLC-FC-18-EVALUATION-017]
    rule: Reject source-undefined zero denominators before evaluation and never clamp them.
  - id: missing-science-guard
    applies_to: [TLC-FC-18-EVALUATION-005, TLC-FC-18-EVALUATION-010, TLC-FC-18-EVALUATION-011, TLC-FC-18-EVALUATION-013, TLC-FC-18-EVALUATION-019, TLC-FC-18-EVALUATION-020]
    rule: Missing M_r E_truth nonempty peer population E_community and other unresolved source requirements produce structured non-execution rather than defaults.
  - id: no-hidden-renormalization
    applies_to: [TLC-FC-18-EVALUATION-013, TLC-FC-18-EVALUATION-014]
    rule: Source weights must satisfy their supplied constraints; never project renormalize or solve the simplex implicitly.
  - id: downstream-boundary
    applies_to: [TLC-FC-18-EVALUATION-001, TLC-FC-18-EVALUATION-017]
    rule: Regulation consumes Evaluation and Fairness supplies separate distributive-justice mechanisms; neither creates an Evaluation runtime dependency.
  - id: structural-unresolved-preservation
    applies_to: [TLC-FC-18-EVALUATION-019, TLC-FC-18-EVALUATION-020]
    rule: E_community and M_r gaps remain explicit autonomous guards and are never filled from thematic neighbor domains.
