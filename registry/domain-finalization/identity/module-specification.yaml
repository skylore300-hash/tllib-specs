  Provide source-faithful Identity structure, conditional dissonance/threshold/dynamics/bound/metric evaluation,
  structural attractor descriptors, and non-execution guards for incomplete theorem and indicator claims across
  exactly thirteen features while preserving every unresolved scientific boundary.
