  - {operation: evaluate_identity_dissonance, features: [TLC-FC-26-IDENTITY-002], semantic_evaluation: conditional_on_external_geometry}
  - {operation: assess_identity_health, features: [TLC-FC-26-IDENTITY-003], semantic_evaluation: conditional_on_external_threshold}
