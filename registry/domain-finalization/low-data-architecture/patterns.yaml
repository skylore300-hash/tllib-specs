schema_version: 1
domain: low-data-architecture
status: finalized
patterns:
- id: LDA-PAT-001
  name: source-bounded structural preservation
  statement: Formulae and claims remain structural unless all source-required operands, types, providers, and degenerate cases
    are supplied.
- id: LDA-PAT-002
  name: non-invention guard
  statement: Missing norms, thresholds, solvers, inverses, convergence, reconstruction, normalization and cross-domain authority
    remain unresolved/provider-backed.
