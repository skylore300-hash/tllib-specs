schema_version: 1
domain: reflexivity
patterns:
  - id: source-expression-preservation
    applies_to: [TLC-FC-27-REFLEXIVITY-002, TLC-FC-27-REFLEXIVITY-003, TLC-FC-27-REFLEXIVITY-005]
    rule: Preserve every source term and sign exactly; do not infer semantic correctness from literal executability.
  - id: identity-authority-delegation
    applies_to: [TLC-FC-27-REFLEXIVITY-001, TLC-FC-27-REFLEXIVITY-002, TLC-FC-27-REFLEXIVITY-003, TLC-FC-27-REFLEXIVITY-004, TLC-FC-27-REFLEXIVITY-005, TLC-FC-27-REFLEXIVITY-006, TLC-FC-27-REFLEXIVITY-007, TLC-FC-27-REFLEXIVITY-009]
    rule: Reference published Identity state Phi_id and Phi_seuil semantics rather than redefining them.
  - id: provider-backed-evidence
    applies_to: [TLC-FC-27-REFLEXIVITY-003, TLC-FC-27-REFLEXIVITY-004, TLC-FC-27-REFLEXIVITY-005, TLC-FC-27-REFLEXIVITY-006, TLC-FC-27-REFLEXIVITY-007, TLC-FC-27-REFLEXIVITY-008]
    rule: Missing scientific values trajectories certificates or qualitative assessments yield structured errors rather than defaults.
  - id: contradiction-exposure
    applies_to: [TLC-FC-27-REFLEXIVITY-002, TLC-FC-27-REFLEXIVITY-003, TLC-FC-27-REFLEXIVITY-005, TLC-FC-27-REFLEXIVITY-009]
    rule: Keep positive operator/social signs and negative adaptive-gradient sign simultaneously visible.
  - id: no-dynamics-solver
    applies_to: [TLC-FC-27-REFLEXIVITY-003, TLC-FC-27-REFLEXIVITY-005, TLC-FC-27-REFLEXIVITY-006, TLC-FC-27-REFLEXIVITY-007]
    rule: Produce RHS or evidence assessment only; never integrate trajectories or fabricate convergence certificates.
  - id: qualitative-preservation-guard
    applies_to: [TLC-FC-27-REFLEXIVITY-008]
    rule: Preserve narrative Values-Practices and contextual conditions without inventing metrics or runtime dependencies.
