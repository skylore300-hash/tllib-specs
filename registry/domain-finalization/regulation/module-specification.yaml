module_invariants:
  - Source signs expressions boolean grouping and denominators remain recognizable and unchanged.
  - No threshold matrix shape norm gradient derivative Jacobian eigenvalue distribution or reference state is invented.
  - The W_f scalar-plus-matrix ambiguity is never broadcast or repaired silently.
  - The negative-definite A condition and its convergence contradiction remain explicitly unresolved.
  - RHS features do not integrate time and the guided correction feature returns a delta rather than mutating state.
  - Theorem statements are descriptors and never runtime convergence stability or Lyapunov certificates.
  - Evaluation is a scientific provider relation only; runtime domain dependencies remain empty.
  - Operational safeguards remain qualitative descriptors and are not algorithmized.
non_goals: [runtime implementation, C++ implementation, Python binding, ODE solver, numerical integrator, optimizer, Jacobian construction, eigenvalue solver, Monte Carlo model, Lyapunov proof, convergence certificate, governance engine]
