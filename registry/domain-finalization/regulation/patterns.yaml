schema_version: 1
domain: regulation
patterns:
  - id: provider-backed-source-expression
    applies_to: [TLC-FC-19-REGULATION-001, TLC-FC-19-REGULATION-002, TLC-FC-19-REGULATION-003, TLC-FC-19-REGULATION-004, TLC-FC-19-REGULATION-005, TLC-FC-19-REGULATION-006, TLC-FC-19-REGULATION-008, TLC-FC-19-REGULATION-009, TLC-FC-19-REGULATION-010, TLC-FC-19-REGULATION-011, TLC-FC-19-REGULATION-013, TLC-FC-19-REGULATION-015, TLC-FC-19-REGULATION-017, TLC-FC-19-REGULATION-018]
    rule: Evaluate source expressions only when every undefined threshold norm gradient derivative spectral value feature map reference state and compatibility rule is supplied explicitly.
  - id: rhs-not-integrator
    applies_to: [TLC-FC-19-REGULATION-002, TLC-FC-19-REGULATION-006, TLC-FC-19-REGULATION-008, TLC-FC-19-REGULATION-009, TLC-FC-19-REGULATION-010, TLC-FC-19-REGULATION-011]
    rule: Return exact source right-hand sides only; never advance time or select a numerical ODE method.
  - id: denominator-guard
    applies_to: [TLC-FC-19-REGULATION-003, TLC-FC-19-REGULATION-005, TLC-FC-19-REGULATION-006]
    rule: Reject empty solution domains and N less than or equal to 1 before source denominators are used; never clamp or substitute.
  - id: contradiction-preservation
    applies_to: [TLC-FC-19-REGULATION-006, TLC-FC-19-REGULATION-007, TLC-FC-19-REGULATION-014, TLC-FC-19-REGULATION-016, TLC-FC-19-REGULATION-020]
    rule: Preserve the W_f scalar-matrix incompatibility and negative-A convergence contradiction without broadcast sign repair or theorem overclaim.
  - id: theorem-noncertification
    applies_to: [TLC-FC-19-REGULATION-012, TLC-FC-19-REGULATION-014, TLC-FC-19-REGULATION-015, TLC-FC-19-REGULATION-020]
    rule: The mastery and coupled convergence statements remain source claims; no proof Lyapunov decay bound rate or runtime certificate is generated.
  - id: evaluation-boundary
    applies_to: [TLC-FC-19-REGULATION-001]
    rule: Regulation scientifically reuses Evaluation validity semantics from TLC-FC-18-EVALUATION-001 but does not create a runtime domain dependency.
  - id: qualitative-governance-boundary
    applies_to: [TLC-FC-19-REGULATION-019]
    rule: Operational risks and safeguards remain descriptors and evidence categories rather than an automated governance algorithm.
