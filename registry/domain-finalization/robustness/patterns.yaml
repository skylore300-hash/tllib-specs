    rule: preserve unresolved decomposition and sign ambiguities exactly
  singularity_guard:
    applies_to: [TLC-FC-20-ROBUSTNESS-004, TLC-FC-20-ROBUSTNESS-005, TLC-FC-20-ROBUSTNESS-016, TLC-FC-20-ROBUSTNESS-018, TLC-FC-20-ROBUSTNESS-022, TLC-FC-20-ROBUSTNESS-023, TLC-FC-20-ROBUSTNESS-027, TLC-FC-20-ROBUSTNESS-028, TLC-FC-20-ROBUSTNESS-035]
