    source_objects: [TLC-SO-CULTURE-016, TLC-SO-CULTURE-017, TLC-SO-CULTURE-018, TLC-SO-CULTURE-019, TLC-SO-CULTURE-020, TLC-SO-CULTURE-021, TLC-SO-CULTURE-022]
    source_section: '2. Fonction structurante'
    purpose: Preserve the four source-declared influence surfaces reception of Message, application of Principles, incarnation of Values, and practice of Competencies without inventing effect magnitudes or transfer functions.
