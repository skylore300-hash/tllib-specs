    source_section: '3. Plasticité culturelle et noyau identitaire'
    purpose: Preserve the qualitative robust-versus-plastic distinction while refusing a local numeric classification because the source supplies no separation threshold.
    inputs: [element_reference, contextual_sensitivity_reference, external_classification_evidence]
    outputs: [plasticity_classification_availability]
    preconditions: [source qualitative categories are available]
    invariants: [Principles and fundamental Values are cited as mainly robust, Practices and some Competencies as mainly plastic, no threshold is invented, S_contexte remains Context-owned]
    invalid_cases: [request for threshold-based local classification without external evidence]
