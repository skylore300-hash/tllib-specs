    source_section: '1. Définition'
    purpose: Preserve Culture as the cultural and symbolic factors of Context and enumerate only the source-listed cultural contents without constructing a separate cultural state space.
    inputs: [context_reference, cultural_component_reference, symbolic_component_reference, symbolic_metric_carrier_reference]
    outputs: [culture_component_descriptor]
    preconditions: [published Context authority is referenced]
    invariants: [C_cultural times C_symbolic remains a subset of C, M remains metric and not necessarily vectorial, no C_culture or autonomous cultural geometry]
    invalid_cases: [request to construct cultural coordinates, request to create a cultural metric or autonomous state space]
    algorithmic: true
    scientific_status: preserved_unresolved
  - feature_id: TLC-FC-25-CULTURE-002
    canonical_name: Cultural transmission influence descriptor
