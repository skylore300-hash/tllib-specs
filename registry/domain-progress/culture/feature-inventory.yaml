    source_section: '2. Fonction structurante'
    purpose: Delegate evaluation of a cultural-factor weight RHS to a caller-supplied provider conforming to Context feature TLC-FC-24-CONTEXT-004 without reimplementing the formula in Culture.
    inputs: [cultural_weight_inputs, context_weight_rhs_provider]
    outputs: [delegated_dw_i_dt]
    preconditions: [provider attests conformance to TLC-FC-24-CONTEXT-004 and receives the source-declared inputs]
    invariants: [Context is the mathematical authority, no duplicated cultural ODE, no solver or default coefficients]
    invalid_cases: [missing provider, provider not conformant to Context authority, request for local cultural dynamics]
    algorithmic: true
    scientific_status: external_provider_required
