    outputs: [cultural_influence_descriptor]
    preconditions: [all referenced tradition objects are treated as opaque references]
    invariants: [exact four influence surfaces preserved, no quantitative influence coefficient, no new dependency inferred from a prose mention alone]
    invalid_cases: [request for influence score, request for unsourced transfer function]
    algorithmic: true
    scientific_status: partially_defined
