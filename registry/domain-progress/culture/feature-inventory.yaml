    source_section: '2. Fonction structurante'
    purpose: Record that Culture participates in Context weights and couplings and that cultural weight variation remains governed by the general Context law rather than a separate cultural metric or dynamics.
    inputs: [context_weight_reference, context_coupling_reference, contextual_tensor_reference, event_references]
    outputs: [cultural_context_participation_descriptor]
    preconditions: [Context metric and weight dynamics are referenced as external authority]
    invariants: [g_c remains Context-owned, w_i dynamics are not duplicated as an autonomous cultural law, events crises innovations and social transformations remain qualitative drivers]
