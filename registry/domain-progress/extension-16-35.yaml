schema_version: 1
program:
  id: domains-16-35-extension
  strategy: vertical-domain-completion
  publication_policy: complete-domain-only
  pilot_domain: 16
  production_branch_pattern: pipeline/domain-<index>-<slug>
  production_pr_policy: one-domain-per-pr

baseline:
  completed_domain_range: 00-15
  published_domain_count: 16
  published_feature_count: 166
  stable_catalog: handoff/catalog.json
  required_ancestor: 2b32e5a49e57389d03b1f4958bf3ca5cae2dbf1b

source_authorities:
  domain_index: maths/README.md
  integration_documents:
    - maths/integration/synthesis-and-supreme-integration.md
    - maths/integration/towards-implementation.md
    - maths/integration/tl-as-a-general-theory.md
  completed_domain_artifacts:
    range: 00-15
    domain_progress: registry/domain-progress/
    domain_finalization: registry/domain-finalization/
    optimized_ir: registry/optimized-ir/
    algorithms: registry/algorithms/
    oracles: registry/oracles/
    handoff_domains: handoff/domains/
    handoff_features: handoff/features/

states:
  scientific_source: complete
  functional_decomposition: not_started
  registries: not_started
  ir: not_started
  contracts: not_started
  algorithms: not_started
  oracles: not_started
  handoff_packages: not_started

publication_rules:
  incomplete_domain_in_global_catalog: forbidden
  empty_or_placeholder_package: forbidden
  domain_catalog_entry_requires:
    - all_retained_features_finalized
    - complete_traceability
    - contracts_complete
    - oracles_complete
    - validation_passed
    - deterministic_export
  linked_domains_may_be_analyzed_together: true
  linked_domains_are_merged_separately: true
  shared_contract_requires_demonstrated_need: true
  algorithm_requires_source_backed_procedure: true
  declarative_feature_may_omit_algorithm: true
  scientific_ambiguities_must_be_preserved: true
  scientifically_blocked_feature_is_not_implementation_ready: true

waves:
  - id: pilot
    order: 0
    title: Pilote
    domains: [16]
    analysis_groups: []
  - id: wave-1
    order: 1
    title: Fondations temporelles et contextuelles
    domains: [22, 23, 24, 25, 26, 27]
    analysis_groups:
      - [22, 23]
      - [24, 25]
      - [26, 27]
  - id: wave-2
    order: 2
    title: Mesure, contrôle et fidélité
    domains: [18, 19, 20, 21, 32, 35]
    analysis_groups:
      - [18, 19]
      - [20, 21]
      - [32, 35]
  - id: wave-3
    order: 3
    title: Finalité et propagation à grande échelle
    domains: [28, 29, 30, 31]
    analysis_groups:
      - [29, 30, 31]
  - id: wave-4
    order: 4
    title: Orchestration de la transmission
    domains: [17, 34]
    analysis_groups: []
  - id: wave-5
    order: 5
    title: Architecture spécialisée
    domains: [33]
    analysis_groups: []

dependency_graph:
  policy:
    confirmed_requires_explicit_source_evidence: true
    historical_shared_tex_is_not_sufficient: true
    thematic_proximity_is_not_sufficient: true
    analysis_dependency_is_not_runtime_dependency: true
    scientific_dependency_is_not_shared_contract_dependency: true
    provisional_edges_do_not_order_domain_publication: true
  analysis:
    - id: analysis-22-23
      members: [22, 23]
      status: operational
    - id: analysis-24-25
      members: [24, 25]
      status: operational
    - id: analysis-26-27
      members: [26, 27]
      status: operational
    - id: analysis-18-19
      members: [18, 19]
      status: operational
    - id: analysis-20-21
      members: [20, 21]
      status: operational
    - id: analysis-32-35
      members: [32, 35]
      status: operational
    - id: analysis-29-30-31
      members: [29, 30, 31]
      status: operational
  scientific:
    - id: scientific-16-00
      from_domain: 16
      to_domain: 0
      status: confirmed
      evidence: maths/16-cohort/cohort.md
      rationale: Cohort trait drift explicitly uses the Master profile mu_M.
    - id: scientific-16-01
      from_domain: 16
      to_domain: 1
      status: confirmed
      evidence: maths/16-cohort/cohort.md
      rationale: Cohort is explicitly a collective/set of Disciples and uses Disciple trait profiles.
    - id: scientific-17-04
      from_domain: 17
      to_domain: 4
      status: unresolved
      evidence: maths/17-cascade-transmission/cascade-transmission-system.md
      rationale: Domain 17 constructs N_inv(t) locally while using pi_N and invariant-core notions without explicitly binding their authority to Domain 04; the ownership relation is preserved unresolved.
    - id: scientific-19-18
      from_domain: 19
      to_domain: 18
      status: confirmed
      evidence: maths/19-regulation/regulation.md
      rationale: Regulation explicitly uses evaluation results to correct trajectories and adapt the system.
    - id: scientific-20-21
      from_domain: 20
      to_domain: 21
      status: confirmed
      evidence: maths/20-robustness/robustness.md
      rationale: Robustness explicitly assigns its procedural dimension to Fairness.
    - id: scientific-22-23
      from_domain: 22
      to_domain: 23
      status: confirmed
      evidence: maths/22-temporality/temporality.md
      rationale: Temporality explicitly uses the memory kernel and mnemonic operator defined by Memory.
    - id: scientific-25-24
      from_domain: 25
      to_domain: 24
      status: confirmed
      evidence: maths/25-culture/culture.md
      rationale: Culture explicitly reuses the contextual space and contextual adaptation operator rather than defining an autonomous replacement.
    - id: scientific-27-26
      from_domain: 27
      to_domain: 26
      status: confirmed
      evidence: maths/27-reflexivity/reflexivity.md
      rationale: Reflexivity is defined as a process over the identity state and reuses the identity dissonance cost.
    - id: scientific-28-04
      from_domain: 28
      to_domain: 4
      status: confirmed
      evidence: maths/28-finality-and-evolutionary-teleology/finality-and-evolutionary-teleology.md
      rationale: Finality requires invariant-core preservation and pi_N without defining the invariant authority locally.
    - id: scientific-29-04
      from_domain: 29
      to_domain: 4
      status: confirmed
      evidence: maths/29-generational-propagation/generational-propagation.md
      rationale: Generational Propagation uses N_inv, d_D and pi_N while leaving invariant authority external.
    - id: scientific-30-04
      from_domain: 30
      to_domain: 4
      status: confirmed
      evidence: maths/30-expansion/expansion.md
      rationale: Expansion constrains translation, adaptation, grafting and schools by N_inv and pi_N.
    - id: scientific-30-24
      from_domain: 30
      to_domain: 24
      status: confirmed
      evidence: maths/30-expansion/expansion.md
      rationale: Expansion directly reuses contextual distance d_C(C2,C1) defined by Context.
    - id: scientific-30-29
      from_domain: 30
      to_domain: 29
      status: confirmed
      evidence: maths/30-expansion/expansion.md
      rationale: Expansion explicitly uses the generational graph and does not redefine replication quality or R.
    - id: scientific-31-04
      from_domain: 31
      to_domain: 4
      status: confirmed
      evidence: maths/31-institutionalization/institutionalization.md
      rationale: Institutionalization uses pi_N and N_inv and defines Dog as a subset of N_inv.
    - id: scientific-31-29
      from_domain: 31
      to_domain: 29
      status: confirmed
      evidence: maths/31-institutionalization/institutionalization.md
      rationale: Institutionalization maps V_t to roles and removes excluded transmitters from the transmission graph defined by Generational Propagation.
    - id: scientific-31-24
      from_domain: 31
      to_domain: 24
      status: unresolved
      evidence: maths/31-institutionalization/institutionalization.md
      rationale: Institutionalization explicitly compares tau_adapt with Context but reports a conflicting or unclear convention.
    - id: scientific-32-04
      from_domain: 32
      to_domain: 4
      status: confirmed
      evidence: maths/32-drift-and-correction/stability-drift-and-correction.md
      rationale: Drift diagnostics explicitly defer the fundamental invariant definition to domain 04.
    - id: scientific-33-04
      from_domain: 33
      to_domain: 4
      status: unresolved
      evidence: maths/33-low-data-architecture/architectural-principles-for-low-data-environments.md
      rationale: Domain 33 uses N_inv and pi_N_min while defining N_min locally, but never explicitly binds repository authority to Domain 04; ownership remains unresolved.
    - id: scientific-34-04
      from_domain: 34
      to_domain: 4
      status: unresolved
      evidence: maths/34-transmission-lifecycle/empowerment-phase.md
      rationale: Empowerment uses pi_N and invariant-core notions without explicitly binding repository authority to Domain 04; ownership remains unresolved.
    - id: scientific-34-21
      from_domain: 34
      to_domain: 21
      status: confirmed
      evidence: maths/34-transmission-lifecycle/validation-phase.md
      rationale: Validation Phase explicitly delegates fairness corrections to Domain 21 without importing unrelated fairness machinery.
    - id: scientific-34-29
      from_domain: 34
      to_domain: 29
      status: confirmed
      evidence: maths/34-transmission-lifecycle/empowerment-phase.md
      rationale: Empowerment explicitly states that its output joins Domain 29 generational propagation and the G_t authority.
    - id: scientific-35-04
      from_domain: 35
      to_domain: 4
      status: confirmed
      evidence: maths/35-fidelity-to-invariant-core/fidelity-to-the-invariant-core.md
      rationale: Fidelity explicitly states that it does not redefine the invariants specified by domain 04.
  runtime: []
  shared_contract: []

