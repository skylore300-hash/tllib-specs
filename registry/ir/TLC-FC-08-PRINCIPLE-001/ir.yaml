- SourceProvenance
parameterized_types: []
symbolic_types:
- ImmutableSymbolicAst
operations:
- operation_id: IR-OP-PRINCIPLE-001-001
  name: construct_principle_constraint_specification
  technical_processing: Validate opaque identifiers; instantiate the source-ordered templates; attach scientific object IDs,
    source ranges, unresolved and assumption IDs; freeze the result.
  templates:
  - generative_support(principle, hypothesis_construction, latent_structure_identification, practice_or_solution_invention,
    experience_reinterpretation)
  - coherence_requires(formal_constraints)
  - 'message_set_for_principle = set(message | exists discourse in principle_discourses: discourse succeeds_under principle
    message)'
  - implies(discourse succeeds_under principle message and analogous(discourse_prime, discourse), discourse_prime succeeds_under
    principle message_prime)
  - message_star = argmax(message, sum(principle_weight * conformity(message, principle)))
  scientific_evaluation: prohibited
operation_sequence:
- validate_required_identifiers
- instantiate_source_ordered_symbolic_templates
- attach_traceability_and_reservations
- freeze_and_return_result
preconditions:
- id: PRE-PRINCIPLE-001-IDS
  statement: Every required opaque identifier is non-empty and every covered object ID is present exactly once.
- id: PRE-PRINCIPLE-001-SOURCE
  statement: Every symbolic template is bound to its cited source range.
postconditions:
- id: POST-PRINCIPLE-001-EFFECT
  statement: Produces five source-ordered symbolic constraint nodes with object IDs and provenance preserved.
- id: POST-PRINCIPLE-001-OPAQUE
  statement: No opaque symbol, operator, predicate, relation, metric, or scientific statement is evaluated.
- id: POST-PRINCIPLE-001-TRACE
  statement: Object IDs, source ranges, unresolved IDs, assumption IDs, and reservations are preserved.
