parameterized_types: []
symbolic_types:
- ImmutableSymbolicAst
operations:
- operation_id: IR-OP-PRINCIPLE-003-001
  name: construct_principle_equation_catalog
  technical_processing: Validate opaque identifiers; instantiate the source-ordered templates; attach scientific object IDs,
    source ranges, unresolved and assumption IDs; freeze the result.
  templates:
  - equivalent(discourse succeeds_under principle message, member(message, set(message_prime | principle_predicate(discourse,
    message_prime))))
  - implies(similar(discourse_1, discourse_2), similar(message_1, message_2))
  - 'and(equals(composite_discourses, intersect(principle_1_discourses, principle_2_discourses)), equivalent(discourse succeeds_under
    composite_principle message, exists intermediate_message: discourse succeeds_under principle_1 intermediate_message and
    intermediate_message succeeds_under principle_2 message))'
  - equals(final_message, limit(time_to_infinity, interpretation_operator(principles, discourses, message_at_time)))
  scientific_evaluation: prohibited
operation_sequence:
- validate_required_identifiers
- instantiate_source_ordered_symbolic_templates
- attach_traceability_and_reservations
- freeze_and_return_result
preconditions:
- id: PRE-PRINCIPLE-003-IDS
  statement: Every required opaque identifier is non-empty and every covered object ID is present exactly once.
- id: PRE-PRINCIPLE-003-SOURCE
  statement: Every symbolic template is bound to its cited source range.
postconditions:
- id: POST-PRINCIPLE-003-EFFECT
  statement: Produces four immutable equation ASTs keyed by their scientific object IDs with no equation evaluation.
- id: POST-PRINCIPLE-003-OPAQUE
  statement: No opaque symbol, operator, predicate, relation, metric, or scientific statement is evaluated.
- id: POST-PRINCIPLE-003-TRACE
  statement: Object IDs, source ranges, unresolved IDs, assumption IDs, and reservations are preserved.
