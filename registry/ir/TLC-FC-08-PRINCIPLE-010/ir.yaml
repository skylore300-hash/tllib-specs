- OpaqueSymbolId
- SourceProvenance
parameterized_types: []
symbolic_types:
- ImmutableSymbolicAst
operations:
- operation_id: IR-OP-PRINCIPLE-010-001
  name: construct_principle_relation_catalog
  technical_processing: Validate opaque identifiers; instantiate the source-ordered templates; attach scientific object IDs,
    source ranges, unresolved and assumption IDs; freeze the result.
  templates:
  - analogy_generation(discourse, message, analogous_discourse, adapted_message)
  - master_regulation(exemplification, calibration, threshold_management)
  - bidirectional_non_reductive_interaction(principle, discourse)
  - abstract_relation(succeeds_under_P)
  - relation(principle forces discourse)
  - member(apply(principle, discourse), interpretation_space)
  - satisfies(discourse, principle)
  - equals(message, interpretation_operator(principle, discourse))
  scientific_evaluation: prohibited
operation_sequence:
- validate_required_identifiers
- instantiate_source_ordered_symbolic_templates
- attach_traceability_and_reservations
- freeze_and_return_result
preconditions:
- id: PRE-PRINCIPLE-010-IDS
  statement: Every required opaque identifier is non-empty and every covered object ID is present exactly once.
- id: PRE-PRINCIPLE-010-SOURCE
  statement: Every symbolic template is bound to its cited source range.
postconditions:
- id: POST-PRINCIPLE-010-EFFECT
  statement: Produces eight source-keyed relation ASTs and annotations without inferring endpoints or evaluating any relation.
- id: POST-PRINCIPLE-010-OPAQUE
  statement: No opaque symbol, operator, predicate, relation, metric, or scientific statement is evaluated.
- id: POST-PRINCIPLE-010-TRACE
  statement: Object IDs, source ranges, unresolved IDs, assumption IDs, and reservations are preserved.
