domain: principle
ir_kind: prototype_ir_with_reservations
entrypoint: associate_principle_with_familiar_context
primary_operation: Construct a provenance-bearing association between a principle and caller-identified familiar discourse
  or situation references.
inputs:
- id: IR-IN-PRINCIPLE-011
  type: PrincipleContextAssociationRequest
  required: true
outputs:
- id: IR-OUT-PRINCIPLE-011
  type: PrincipleInterpretationAssociation
  observable_effect: Produces an immutable association containing one principle ID and at least one familiar-context ID, without
    interpreting the relation.
opaque_types:
- OpaqueSymbolId
- SourceProvenance
parameterized_types: []
symbolic_types:
- ImmutableSymbolicAst
operations:
- operation_id: IR-OP-PRINCIPLE-011-001
  name: associate_principle_with_familiar_context
  technical_processing: Validate opaque identifiers; instantiate the source-ordered templates; attach scientific object IDs,
    source ranges, unresolved and assumption IDs; freeze the result.
  templates:
  - interpretation_association(principle_id, non_empty(familiar_discourse_or_situation_ids))
  scientific_evaluation: prohibited
operation_sequence:
- validate_required_identifiers
- instantiate_source_ordered_symbolic_templates
- attach_traceability_and_reservations
- freeze_and_return_result
preconditions:
- id: PRE-PRINCIPLE-011-IDS
  statement: Every required opaque identifier is non-empty and every covered object ID is present exactly once.
- id: PRE-PRINCIPLE-011-SOURCE
  statement: Every symbolic template is bound to its cited source range.
postconditions:
- id: POST-PRINCIPLE-011-EFFECT
  statement: Produces an immutable association containing one principle ID and at least one familiar-context ID, without interpreting
    the relation.
- id: POST-PRINCIPLE-011-OPAQUE
  statement: No opaque symbol, operator, predicate, relation, metric, or scientific statement is evaluated.
- id: POST-PRINCIPLE-011-TRACE
  statement: Object IDs, source ranges, unresolved IDs, assumption IDs, and reservations are preserved.
invariants:
- object_id: TLC-SO-PRINCIPLE-059
  object_type: Relation
  source_statement_preserved: true
errors:
- id: ERR-PRINCIPLE-011-MISSING
  condition: A required symbol, covered object ID, or source reference is missing.
- id: ERR-PRINCIPLE-011-DUPLICATE
  condition: A covered object ID occurs more than once.
- id: ERR-PRINCIPLE-011-PROMOTION
  condition: A caller requests evaluation or canonical scientific promotion.
undefined_behaviors:
- Familiarity, interpretation meaning, ranking, similarity, validation, and effect on understanding remain opaque.
propagated_unresolved: []
propagated_provisional_assumptions:
- TLC-EA-PRINCIPLE-011-001
