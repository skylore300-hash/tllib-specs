  - metric_symbol
  - scalar_curvature_operator_symbol
  - dimension_symbol
  - differential_symbol
  - time_symbol
  - gradient_operator_symbol
  field_semantics: opaque_identifiers_only
outputs:
- output_id: OUTPUT-INVARIANTS-006-SYMBOLIC
  type: SymbolicCollectiveEthicsInvariant
  observable_effect: Produces an immutable symbolic AST for the cited integral plus derivative-equals-zero and gradient-equals-zero
    constraint ASTs, each carrying source provenance.
  expression_templates:
  - integral(value_space_symbol, multiply(apply(scalar_curvature_operator_symbol, metric_symbol), sqrt(det(metric_symbol))),
    differential(dimension_symbol, differential_symbol))
  - equals(derivative(collective_ethics_invariant, time_symbol), zero)
  - equals(apply(gradient_operator_symbol, collective_ethics_invariant), zero)
  evaluated: false
