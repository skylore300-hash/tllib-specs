postconditions: [raw source metric value is returned without an interpretation label]
invariants: [orientation is not relabeled as higher-is-better or lower-is-better, source negative exponential sign is preserved]
errors: [NormProviderRequired, InvalidMetricDenominator, EfficiencyInterpretationUnavailable]
opaque_parameters: [norm semantics, tau, orientation semantics]
