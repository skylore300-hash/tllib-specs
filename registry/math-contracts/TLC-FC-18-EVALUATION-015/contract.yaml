source_sections: ['6. Métriques systémiques', '7. Limites et points scientifiques non résolus']
formula: 'I_efficiency(t)=(||X_real-X_ideal||/||X_initial-X_ideal||)(1/t) exp(-(sigma_E^2+||bias||^2)/(2 tau^2))'
