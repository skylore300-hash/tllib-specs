providers: [evaluation_statistics_provider, correlation_provider, norm_provider]
outputs: [I_fairness]
preconditions: [evaluation mean is nonzero, statistics correlation and bias norm values are supplied]
postconditions: [result equals the Evaluation procedural formula only]
invariants: [minus standard-deviation/mean sign is preserved, minus bias-norm sign is preserved, no distributive-justice mechanism is imported]
errors: [FairnessStatisticsProviderRequired, CorrelationProviderRequired, NormProviderRequired, InvalidMetricDenominator]
opaque_parameters: [statistical estimation semantics, norm semantics, alpha, beta, gamma]
dependencies: {scientific: [], runtime: []}
