contract_id: TLC-MC-TLC-FC-18-EVALUATION-017
feature_id: TLC-FC-18-EVALUATION-017
title: Procedural fairness metric expression
domain_id: evaluation
contract_kind: guarded_source_expression
scientific_status: external_provider_required
scientific_authority: maths/18-evaluation/evaluation.md
source_sections: ['6. Métriques systémiques', '7. Limites et points scientifiques non résolus']
formula: 'I_fairness = 1 - sigma(E_individual)/mu(E_individual) + alpha corr(E_individual,M_real) - beta ||bias|| + gamma V_justice'
