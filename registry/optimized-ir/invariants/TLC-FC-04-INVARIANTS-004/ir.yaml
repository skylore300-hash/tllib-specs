- wrong source object or relation raises WrongScopeObject
- absent root reference raises MissingRootReference
- any attempt to invent members or a validation rule raises ScientificEvaluationProhibited
- otherwise construct, freeze, verify, and return
state_before:
  value: caller-owned disciple scope evidence
  mutated: false
state_after:
  value: one immutable ScopedInvariantDeclaration
  input_mutated: false
effects:
