- output scope is disciple and source root reference is unchanged
- output is scientifically deferred
- catalogue status, assumptions, reservations, and opaque content are unchanged
conditions_of_conservation:
- exact source object and relation identities
- exact root reference and disciple scope
- exact deferred status and opaque metadata
conditions_of_violation:
- wrong scope object or relation
- missing root reference
- invented member set or validation rule
- status promotion or preservation loss
errors:
- WrongScopeObject
- MissingRootReference
- StatusPromotionProhibited
- ScientificEvaluationProhibited
- PreservationViolation
