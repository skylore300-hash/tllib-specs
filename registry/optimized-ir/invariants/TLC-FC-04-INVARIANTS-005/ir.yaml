- OpaqueScientificTruthConditions
preconditions:
- id: PRE-INVARIANTS-005-SPECIALIZED
  statement: every annotation ID and refers_to relation is covered and targets the invariant root
conditions_of_application:
- annotations are the three source-covered records
- annotations remain ordered and non-normative
- no annotation may alter scientific truth or catalogue status
operations:
- id: INV005-OP-VALIDATE
  name: validate_interpretation_annotations
  effect: validate identity, uniqueness, covered relations, root target, and source order
- id: INV005-OP-ATTACH
  name: attach_annotations_to_root_evidence
  effect: construct immutable annotated evidence with exact ordered annotation copies
- id: INV005-OP-PRESERVE
  name: preserve_non_normative_boundary
  effect: retain source status, truth neutrality, provenance, assumptions, reservations, and opaque content
execution_order:
- INV005-OP-VALIDATE
- INV005-OP-ATTACH
- INV005-OP-PRESERVE
control_flow:
- unknown annotation identity raises UnknownAnnotationId
- target or relation mismatch raises AnnotationTargetMismatch
- duplicate annotation identity raises DuplicateIdentifier
- truth or status modification raises StatusPromotionProhibited
- otherwise attach, freeze, verify, and return
state_before:
  value: caller-owned invariant root evidence and annotation sequence
  mutated: false
state_after:
  value: immutable AnnotatedInvariantEvidence with three ordered annotations
  input_mutated: false
effects:
  external_side_effects: []
  scientific_evaluation: prohibited
postconditions:
- exactly the three covered annotation identities are attached in source order
- every relation targets the invariant root
- annotations are non-normative and cannot change truth or status
- source status, assumptions, reservations, references, and opaque values are unchanged
conditions_of_conservation:
- annotation identity and order equality
- relation and target equality
- invariant root identity equality
- truth-neutral and status-neutral behavior
- exact provenance and opaque-value preservation
conditions_of_violation:
- unknown or duplicate annotation identity
- target or relation mismatch
- annotation reordering when source order is declared
- truth or status change
- preservation loss
errors:
- UnknownAnnotationId
- AnnotationTargetMismatch
- DuplicateIdentifier
- StatusPromotionProhibited
- ScientificEvaluationProhibited
- PreservationViolation
determinism:
  status: deterministic
  rule: identical root evidence and ordered annotations produce structurally equal outputs
