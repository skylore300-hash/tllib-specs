provisional_assumptions_propagated: [TLC-EA-INVARIANTS-007-001]
reservations:
- causality, symmetry, transitivity, and temporal meaning are not inferred
- scientific truth conditions and concrete runtime types remain unspecified
transformations_applied:
- normalized immutable relation record
- shared endpoint validator
- common preservation envelope
obligations_of_preservation:
- preserve TLC-SO-INVARIANTS-068 and TLC-SR-INVARIANTS-067
- preserve exact endpoints and evidence reference
- never infer relation properties
