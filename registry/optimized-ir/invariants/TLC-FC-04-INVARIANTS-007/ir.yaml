scope: community
inputs:
- id: IR-IN-007-SPECIALIZED
  type: RelationEndpointsAndEvidence
  required: true
outputs:
- id: IR-OUT-007-SPECIALIZED
  type: DisintegrationRelationRecord
  immutable: true
  observable_effect: returns one refers_to edge with source, target, relation ID, and evidence reference preserved
types:
  input: RelationEndpointsAndEvidence
  output: DisintegrationRelationRecord
  endpoint: EvidenceIdentifier
  preservation: PreservationEnvelope
opaque_values:
- OpaqueSourceStatement
- OpaqueScientificTruthConditions
preconditions:
- id: PRE-INVARIANTS-007-SPECIALIZED
  statement: source, target, and relation IDs match TLC-SR-INVARIANTS-067
conditions_of_application:
- exact source relation and endpoints are required
- relation meaning is limited to the source-backed refers_to edge
- causality, symmetry, transitivity, and temporal meaning are not inferred
operations:
- id: INV007-OP-VALIDATE
  name: validate_disintegration_endpoints
  effect: validate source object, invariant-root target, relation ID, and evidence reference
- id: INV007-OP-CONSTRUCT
  name: construct_disintegration_relation_record
  effect: create one immutable exact relation record
- id: INV007-OP-PRESERVE
  name: preserve_relation_boundary
  effect: retain provenance, status, assumptions, reservations, and opaque content
execution_order:
- INV007-OP-VALIDATE
- INV007-OP-CONSTRUCT
- INV007-OP-PRESERVE
control_flow:
- endpoint mismatch raises EndpointMismatch
- unknown relation ID raises UnknownRelationId
- missing evidence reference raises MissingSourceReference
- relation inference request raises ScientificEvaluationProhibited
- otherwise construct, freeze, verify, and return
state_before:
  value: caller-owned endpoints and evidence
  mutated: false
state_after:
  value: one immutable DisintegrationRelationRecord
  input_mutated: false
effects:
  external_side_effects: []
  scientific_evaluation: prohibited
postconditions:
- one relation record exists with exact source, target, relation ID, and evidence reference
- catalogue status, assumptions, reservations, and opaque content are unchanged
- no additional relation property is asserted
conditions_of_conservation:
- exact endpoint tuple
- exact relation identity
- exact evidence and provenance
- exact source status and opaque values
conditions_of_violation:
- endpoint or relation mismatch
- absent evidence
- inferred causality, symmetry, transitivity, or time meaning
- preservation loss
errors:
- EndpointMismatch
- UnknownRelationId
- MissingSourceReference
- ScientificEvaluationProhibited
- PreservationViolation
determinism:
  status: deterministic
  rule: identical valid endpoints and evidence produce a structurally equal relation record
