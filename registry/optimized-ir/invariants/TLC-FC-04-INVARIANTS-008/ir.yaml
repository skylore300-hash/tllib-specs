- id: PRE-INVARIANTS-008-SPECIALIZED
  statement: every state term and unresolved identifier is covered by the preparation mapping
conditions_of_application:
- all twelve source-covered term identities and their relations are used only as vocabulary evidence
- eleven feature-owned unresolved IDs are attached exactly to affected terms
- no transition graph, chronology, state detector, or scientific equivalence is inferred
operations:
- id: INV008-OP-VALIDATE-TERMS
  name: validate_state_term_evidence
  effect: validate term identities, uniqueness, source references, relations, and source status
- id: INV008-OP-VALIDATE-UNRESOLVED
  name: validate_unresolved_attachment_map
  effect: validate exact unresolved identity set and affected-term associations
- id: INV008-OP-ASSEMBLE
  name: assemble_state_vocabulary
  effect: create immutable entries keyed by term ID with exact unresolved attachments
- id: INV008-OP-PRESERVE
  name: preserve_state_vocabulary_boundary
  effect: retain provenance, status, assumptions, reservations, and opaque values
execution_order:
- INV008-OP-VALIDATE-TERMS
- INV008-OP-VALIDATE-UNRESOLVED
- INV008-OP-ASSEMBLE
- INV008-OP-PRESERVE
control_flow:
- unknown term identity raises UnknownStateTermId
- duplicate term identity raises DuplicateIdentifier
- missing, added, replaced, or misattached unresolved identity raises UnresolvedMappingLoss
- transition or scientific state inference raises ScientificEvaluationProhibited
- otherwise assemble, freeze, verify, and return
state_before:
  value: caller-owned term evidence and unresolved mapping
  mutated: false
state_after:
  value: immutable InvariantStateVocabulary
  input_mutated: false
effects:
  external_side_effects: []
  scientific_evaluation: prohibited
postconditions:
- vocabulary keys equal the twelve validated source term IDs
- each of the eleven unresolved IDs is attached exactly to its source-mapped affected term
- source relations, status, assumptions, reservations, and opaque values are unchanged
- no transition, chronology, detector, or equivalence exists
conditions_of_conservation:
- exact term identity and relation coverage
- exact unresolved identity set and attachment map
- exact source status, provenance, assumptions, reservations, and opaque values
conditions_of_violation:
- unknown or duplicate term identity
- missing, extra, replaced, or misattached unresolved ID
- inferred state transition, chronology, detector, or equivalence
- preservation loss
errors:
- UnknownStateTermId
- DuplicateIdentifier
- UnresolvedMappingLoss
- MissingSourceReference
- ScientificEvaluationProhibited
- PreservationViolation
determinism:
