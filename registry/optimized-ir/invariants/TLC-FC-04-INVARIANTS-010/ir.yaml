unresolved_propagated: []
provisional_assumptions_propagated: [TLC-EA-INVARIANTS-010-001]
reservations:
- fragments do not define states, transitions, ordering, or state equality
- source catalogue status rejected_as_feature is preserved as metadata while the baseline-active feature is not rejected by finalization
- concrete runtime types and scientific truth conditions remain unspecified
transformations_applied:
- normalized immutable rejected-state annotation index
- common identity, relation, target, and status validation
- common preservation envelope
obligations_of_preservation:
- preserve all three object and relation identities
- preserve non-operational and rejected source status
- never infer state semantics or promote operation status
