  immutable: true
  observable_effect: returns an index containing exactly the three source IDs, each marked non-operational and rejected
types:
  fragment: StateInterpretationFragment
  output_index: RejectedStateAnnotationIndex
  target_relation: EvidenceRelationReference
  preservation: PreservationEnvelope
opaque_values:
- OpaqueSourceStatement
- OpaqueScientificTruthConditions
preconditions:
- id: PRE-INVARIANTS-010-SPECIALIZED
  statement: each fragment ID and its refers_to relation is covered and carries rejected-as-feature status
conditions_of_application:
- only the three source-covered fragments are indexed
- every fragment remains documentary, non-operational, and rejected as source metadata
- no state, transition, ordering, or equality semantics are inferred
operations:
- id: INV010-OP-VALIDATE
  name: validate_state_interpretation_fragments
  effect: validate identities, uniqueness, relations, targets, source references, and rejected status
- id: INV010-OP-INDEX
  name: construct_rejected_state_annotation_index
  effect: create immutable entries keyed by source ID and marked non-operational
- id: INV010-OP-PRESERVE
  name: preserve_rejected_documentary_boundary
  effect: retain source status, provenance, assumptions, reservations, and opaque content
execution_order:
- INV010-OP-VALIDATE
- INV010-OP-INDEX
- INV010-OP-PRESERVE
control_flow:
- duplicate fragment identity raises DuplicateStateFragmentId
- unknown identity, relation, or target raises InvalidCoveredIdentifier
- absent source reference raises MissingSourceReference
- operational promotion or inferred state semantics raises OperationalStatePromotion
- otherwise construct, freeze, verify, and return
state_before:
  value: caller-owned state interpretation fragments
  mutated: false
state_after:
  value: immutable RejectedStateAnnotationIndex
  input_mutated: false
effects:
  external_side_effects: []
  scientific_evaluation: prohibited
postconditions:
- output contains exactly the three source IDs when complete source evidence is supplied
- every entry is non-operational and carries rejected_as_feature source metadata
- source relations, targets, assumptions, reservations, and opaque content are unchanged
- no state, transition, ordering, or equality semantics exist
conditions_of_conservation:
- exact fragment identity set and source order
- exact relation and target tuples
- exact non-operational and rejected source status
- exact provenance and opaque-value preservation
conditions_of_violation:
- duplicate, unknown, or missing source identity
- relation or target mismatch
- operational promotion or inferred state semantics
- preservation loss
errors:
- DuplicateStateFragmentId
- InvalidCoveredIdentifier
- MissingSourceReference
- OperationalStatePromotion
- ScientificEvaluationProhibited
- PreservationViolation
determinism:
  status: deterministic
  rule: identical ordered fragments and metadata produce structurally equal indexes
dependencies:
