preconditions:
  - feature identity equals TLC-FC-15-RELATIONS-002
  - participant sequence equals expected_ids exactly
  - every participant retains its source reference
  - decision_blocker equals scientific_decision_required
  - no semantic or numerical evaluation is requested
conditions_of_application:
  - structural construction or validation only
  - source references remain available
  - opaque values and unresolved metadata can be propagated without interpretation
properties:
  explicitly_defined: []
  deferred:
    - relation_kind
    - endpoint_identity
    - direction
    - arity
    - symmetry
    - reflexivity
    - transitivity
    - antisymmetry
    - equivalence
    - causality
operations:
  - operation_id: REL-002-OP-001
    name: validate_identity
    behavior: require the exact feature identity
  - operation_id: REL-002-OP-002
    name: validate_participants
    behavior: require the exact six ordered participant identifiers
  - operation_id: REL-002-OP-003
    name: validate_source_references
    behavior: require all contract-declared source references
  - operation_id: REL-002-OP-004
    name: preserve_equation_text
    behavior: copy the five source equations as unevaluated opaque text in declared order
  - operation_id: REL-002-OP-005
    name: propagate_blockers
    behavior: preserve scientific_decision_required and all unresolved reservations
  - operation_id: REL-002-OP-006
    name: construct_record
    behavior: build a RelationsBlockedCanonicalRecord without scientific evaluation
  - operation_id: REL-002-OP-007
    name: enforce_non_execution_guard
    behavior: reject every unsupported scientific operation
execution_order:
  - REL-002-OP-001
  - REL-002-OP-002
  - REL-002-OP-003
  - REL-002-OP-004
  - REL-002-OP-005
  - REL-002-OP-006
  - REL-002-OP-007
control_flow:
  - if: identity validation fails
    then: raise FeatureIdentityMismatch
  - if: participant validation fails
    then: raise the applicable participant error
  - if: a source reference is absent
    then: raise MissingSourceReference
  - if: an evaluation request is present
    then: raise ExternalRelationEvaluatorRequired
  - otherwise: return the structural record
