  - operation_id: REL-003-OP-004
    name: preserve_tuple_text
    behavior: copy the tuple equation as unevaluated opaque text
  - operation_id: REL-003-OP-005
    name: propagate_blockers
    behavior: preserve scientific_decision_required and all unresolved reservations
  - operation_id: REL-003-OP-006
    name: construct_record
    behavior: build a RelationsBlockedCanonicalRecord without evaluating an invariant
  - operation_id: REL-003-OP-007
    name: enforce_non_execution_guard
    behavior: reject every unsupported scientific operation
