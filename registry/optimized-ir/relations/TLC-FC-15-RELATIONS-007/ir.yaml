preconditions:
  - feature identity equals TLC-FC-15-RELATIONS-007
  - participant sequence equals expected_ids exactly
  - each participant remains a distinct source-traceable candidate object
  - exactly one opaque payload is supplied for each participant
  - all 12 unresolved items remain attached
  - endpoint identity is not inferred
  - grouped objects are not fused or decomposed automatically
  - no semantic evaluation is requested
conditions_of_application:
  - limited structural construction or validation only
  - contextual refers_to relations are traceability evidence only
  - documentary dependencies are not execution prerequisites
properties:
  explicitly_defined: []
  deferred:
    - relation_semantics
    - endpoint_identity
    - direction
    - arity
    - cardinality
    - symmetry
    - reflexivity
    - transitivity
    - antisymmetry
    - equivalence
    - temporality
    - determinism_of_evaluation
    - causality
operations:
  - operation_id: REL-007-OP-001
    name: validate_identity
    behavior: require the exact feature identity
  - operation_id: REL-007-OP-002
    name: validate_participants
    behavior: require the exact five distinct ordered participant identifiers
  - operation_id: REL-007-OP-003
    name: validate_source_references
    behavior: require all contract traceability rows and cited source lines
  - operation_id: REL-007-OP-004
    name: validate_unresolved
    behavior: require the complete unresolved source set with count 12
  - operation_id: REL-007-OP-005
    name: prohibit_endpoint_inference
    behavior: keep source and target unmaterialized
  - operation_id: REL-007-OP-006
    name: construct_candidate_results
    behavior: create exactly one opaque source-traceable result record per participant without computing a value
  - operation_id: REL-007-OP-007
    name: construct_record
    behavior: assemble a RelationsLimitedCandidateRecord from validated structural fields
  - operation_id: REL-007-OP-008
    name: enforce_non_execution_guard
    behavior: reject every unsupported scientific operation
execution_order:
  - REL-007-OP-001
  - REL-007-OP-002
  - REL-007-OP-003
  - REL-007-OP-004
  - REL-007-OP-005
  - REL-007-OP-006
  - REL-007-OP-007
  - REL-007-OP-008
control_flow:
  - if: identity validation fails
    then: raise FeatureIdentityMismatch
  - if: participant validation fails
    then: raise the applicable participant error
  - if: traceability is incomplete
    then: raise MissingSourceReference
  - if: unresolved count or identity differs
    then: raise UnresolvedPropagationLoss
  - if: source or target is supplied or inferred
    then: raise EndpointInferenceProhibited
  - if: covered objects are fused or automatically decomposed
    then: raise IdentityMergeProhibited
  - if: evaluation is requested
    then: raise ExternalRelationEvaluatorRequired
  - otherwise: return the limited structural record
