schema_version: 1
feature_id: TLC-FC-10-VIRTUES-001
domain: virtues
status: selected_for_virtues_implementation_specification
source:
  contract_ref: registry/math-contracts/TLC-FC-10-VIRTUES-001/contract.yaml
  source_ir_ref: registry/ir/TLC-FC-10-VIRTUES-001/ir.yaml
  source_ir_raw_status: limited_engineering_contract_with_reservations
  test_plan_ref: registry/test-plans/TLC-FC-10-VIRTUES-001/test-plan.yaml
  scientific_source_ref: maths/10-virtues/virtues.md
  source_objects: [TLC-SO-VIRTUES-100]
source_ir_preserved: true
source_contract_preserved: true
replaces_source_ir: false
scientific_source_modified: false
virtue_invented: false
measurement_invented: false
ordering_invented: false
nature: structural_validation
entrypoint: check_apprenticeship_responsibility
virtue_or_reference:
  type: OpaqueVirtue
  identity: source-bound reference carried by artifact and provenance
scope: apprenticeship responsibility handoff record
context: caller-supplied opaque apprenticeship context
inputs:
  feature_id: exact feature identifier
  artifact: opaque handoff record or evidence bundle
  provenance: ordered ProvenanceRef collection
  reservations: caller-supplied unresolved and assumptions
outputs:
  result: VirtuesResult accepted envelope or named error
types: [OpaqueVirtue, OpaqueEvidence, OpaqueContext, ProvenanceRef, VirtuesRequest, VirtuesResult]
opaque_values: [artifact, context, evidence, reservations]
preconditions:
  - feature_id equals TLC-FC-10-VIRTUES-001
  - provenance contains TLC-SO-VIRTUES-100
  - request contains no unsupported scientific or normative completion
conditions_of_application:
  - operation is limited to structural verification and packaging
relations_explicitly_defined:
  - bounded roles represented in the supplied record
  - guided responsibility represented in the supplied record
manifestations_explicitly_defined: []
operations:
  - validate exact feature identity
  - validate required source provenance
  - reject unsupported ranking, scoring, weighting, threshold, hierarchy, metric, formula, or moral-decision requests
  - preserve supplied bounded-role and guided-responsibility fields without interpreting virtue
  - construct source-bound result envelope
order_of_execution: [validate_feature_id, validate_provenance, enforce_completion_guard, preserve_handoff_record, build_result]
control_flow:
  - on invalid feature id return invalid_feature_id
  - on missing provenance return missing_provenance
  - on unsupported completion request return unsupported_scientific_completion_request
  - otherwise return accepted result
observations: []
comparisons: []
effects:
  - no mutation of source artifacts
  - no moral grade or scientific computation
postconditions:
  - feature id, entrypoint, source objects, artifact, reservations, unresolved, and assumptions are preserved
  - accepted result contains no virtue score or moral decision
invariants:
  - source object identity is conserved
  - opaque values are propagated unchanged
  - source object order is conserved
errors: [missing_provenance, unsupported_scientific_completion_request, invalid_feature_id]
determinism:
  deterministic: true
  randomness: none
dependencies:
  internal: [common request envelope, provenance validation, completion guard, result envelope]
  external_execution: []
  documentary: [maths/10-virtues/virtues.md]
unresolved_propagated: []
reservations:
  - no hierarchy, metric, threshold, weight, score, or moral algorithm is specified
  - scientific meaning remains source-bound
transformations_applied:
  - normalized common request and result envelope
  - made validation order explicit
  - separated structural validation from prohibited moral evaluation
obligations_of_preservation:
  - preserve source contract and IR semantics
  - preserve bounded-role and guided-responsibility fields as supplied
  - add no scientific interpretation
algorithm_ref: registry/algorithms/virtues/TLC-FC-10-VIRTUES-001/algorithm.yaml
oracle_ref: registry/oracles/virtues/TLC-FC-10-VIRTUES-001/oracle.yaml
implementation_aptitude:
  ready: true
  level: structural_implementation
  excluded_scope: [moral evaluation, scoring, ranking]
