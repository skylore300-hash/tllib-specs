schema_version: 1
feature_id: TLC-FC-10-VIRTUES-002
domain: virtues
status: selected_for_virtues_implementation_specification
source:
  contract_ref: registry/math-contracts/TLC-FC-10-VIRTUES-002/contract.yaml
  source_ir_ref: registry/ir/TLC-FC-10-VIRTUES-002/ir.yaml
  source_ir_raw_status: limited_engineering_contract_with_reservations
  test_plan_ref: registry/test-plans/TLC-FC-10-VIRTUES-002/test-plan.yaml
  scientific_source_ref: maths/10-virtues/virtues.md
  source_objects: [TLC-SO-VIRTUES-016]
source_ir_preserved: true
source_contract_preserved: true
replaces_source_ir: false
scientific_source_modified: false
virtue_invented: false
measurement_invented: false
ordering_invented: false
nature: declarative
entrypoint: register_observational_learning_assumption
virtue_or_reference:
  type: OpaqueVirtue
  identity: source-bound reference carried by artifact and provenance
scope: observational-learning exposure claims
context: modelage, shadowing, apprenticeship, and community exposure labels remain opaque
inputs:
  feature_id: exact feature identifier
  artifact: opaque claim or evidence bundle
  provenance: ordered ProvenanceRef collection
  reservations: caller-supplied unresolved and assumptions
outputs:
  result: VirtuesResult accepted envelope or named error
types: [OpaqueVirtue, OpaqueEvidence, OpaqueContext, ProvenanceRef, UnresolvedItem, VirtuesRequest, VirtuesResult]
opaque_values: [artifact, exposure labels, evidence, context, reservations]
preconditions:
  - feature_id equals TLC-FC-10-VIRTUES-002
  - provenance contains TLC-SO-VIRTUES-016
  - request does not ask the module to derive an observational-learning algorithm
  - request contains no unsupported scientific or normative completion
conditions_of_application:
  - operation registers supplied claims only
relations_explicitly_defined: []
manifestations_explicitly_defined: []
operations:
  - validate exact feature identity
  - validate required source provenance
  - reject unsupported scientific completion or learning-algorithm derivation
  - copy supplied exposure claims as opaque evidence
  - propagate scientific ambiguity
  - construct source-bound result envelope
order_of_execution: [validate_feature_id, validate_provenance, enforce_completion_guard, register_opaque_claims, propagate_unresolved, build_result]
control_flow:
  - on invalid feature id return invalid_feature_id
  - on missing provenance return missing_provenance
  - on requested algorithm derivation or other unsupported completion return unsupported_scientific_completion_request
  - otherwise return accepted declarative result
observations: []
comparisons: []
effects:
  - no learning transition or acquisition rule is executed
  - no mutation of source artifacts
postconditions:
  - supplied claims and provenance are preserved without interpretation
  - scientific ambiguity is present in the result
  - no learning algorithm, score, hierarchy, or moral decision is produced
invariants:
  - source object identity and order are conserved
  - opaque values and unresolved items are propagated unchanged
errors: [missing_provenance, unsupported_scientific_completion_request, invalid_feature_id]
determinism:
  deterministic: true
  randomness: none
dependencies:
  internal: [common request envelope, provenance validation, completion guard, unresolved propagation, result envelope]
  external_execution: []
  documentary: [maths/10-virtues/virtues.md]
unresolved_propagated: [scientific ambiguity]
reservations:
  - observational-learning semantics are scientifically ambiguous
  - no executable acquisition or imitation algorithm is defined
transformations_applied:
  - normalized declarative registration envelope
  - classified scientific ambiguity as non-blocking unresolved propagation
  - made prohibited algorithm derivation explicit
obligations_of_preservation:
  - preserve source contract and IR semantics
  - preserve exposure labels and scientific ambiguity unchanged
  - add no causal or learning semantics
algorithm_ref: registry/algorithms/virtues/TLC-FC-10-VIRTUES-002/algorithm.yaml
oracle_ref: registry/oracles/virtues/TLC-FC-10-VIRTUES-002/oracle.yaml
implementation_aptitude:
  ready: true
  level: declarative_structural_implementation
  excluded_scope: [learning algorithm, acquisition transition, scoring, ranking]
