source_ir_preserved: true
source_contract_preserved: true
replaces_source_ir: false
scientific_source_modified: false
virtue_invented: false
measurement_invented: false
ordering_invented: false
nature: declarative_relation
entrypoint: map_contextual_virtue_relations
virtue_or_reference:
  type: OpaqueVirtue
  identity: source-bound virtue reference carried by supplied relation claims
scope: contextual virtue relation claims among supplied entities
context: caller-supplied context and endpoints remain opaque
inputs:
  feature_id: exact feature identifier
  artifact: opaque contextual relation bundle
  provenance: ordered ProvenanceRef collection
  reservations: caller-supplied unresolved and assumptions
outputs:
  result: VirtuesResult containing supplied relation claims or named error
types: [OpaqueVirtue, OpaqueEvidence, OpaqueContext, OpaqueRelationEndpoint, ProvenanceRef, VirtuesRequest, VirtuesResult]
opaque_values: [context, relation endpoints, relation labels, evidence, reservations]
preconditions:
  - feature_id equals TLC-FC-10-VIRTUES-014
  - provenance contains all five source objects
  - request does not ask for endpoint identity inference, cross-domain execution, comparison, score, or moral decision
conditions_of_application:
  - only supplied contextual relation claims are mapped
relations_explicitly_defined:
  - supplied contextual virtue relation claims
manifestations_explicitly_defined: []
operations:
  - validate feature identity and provenance
  - reject endpoint inference and unsupported completion
  - preserve supplied relation endpoints, labels, and context
  - register each supplied contextual claim without resolving external entities
  - construct source-bound result envelope
order_of_execution: [validate_feature_id, validate_provenance, enforce_no_inference_guard, copy_endpoints_and_context, register_claims, build_result]
control_flow:
  - on invalid feature id return invalid_feature_id
  - on missing provenance return missing_provenance
  - on endpoint inference, comparison, score, or moral-decision request return unsupported_scientific_completion_request
  - otherwise return accepted relation map
observations: []
comparisons: []
effects:
  - creates a declarative map of supplied claims only
  - resolves no endpoint and creates no execution dependency
postconditions:
  - endpoints, context, relation labels, provenance, and reservations are preserved
  - no endpoint identity, type equivalence, score, or cross-domain behavior is inferred
invariants:
  - source object identity and order are conserved
  - supplied endpoint identity tokens remain unchanged
  - relation cardinality and supplied pairing are preserved
errors: [missing_provenance, unsupported_scientific_completion_request, invalid_feature_id]
determinism: {deterministic: true, randomness: none}
dependencies:
  internal: [common validation, relation preservation, result envelope]
  external_execution: []
  documentary: [master, disciple, community, message, principle, values, practice, relations, maths/10-virtues/virtues.md]
unresolved_propagated: []
reservations:
  - cross-domain endpoint identities and relation execution semantics remain external
  - documentary references are not execution dependencies
transformations_applied:
  - normalized contextual relation representation
  - separated declarative relation mapping from endpoint resolution
  - normalized traceability
obligations_of_preservation:
  - preserve source contract and IR
  - preserve supplied endpoints, context, and relations
  - infer no identity, equivalence, comparison, score, or dependency
algorithm_ref: registry/algorithms/virtues/TLC-FC-10-VIRTUES-014/algorithm.yaml
oracle_ref: registry/oracles/virtues/TLC-FC-10-VIRTUES-014/oracle.yaml
implementation_aptitude:
  ready: true
  level: declarative_relation_implementation
  excluded_scope: [endpoint resolution, cross-domain execution, comparison, scoring]
