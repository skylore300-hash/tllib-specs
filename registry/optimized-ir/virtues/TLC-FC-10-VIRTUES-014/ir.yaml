  source_ir_ref: registry/ir/TLC-FC-10-VIRTUES-014/ir.yaml
  source_ir_raw_status: limited_engineering_contract_with_reservations
  test_plan_ref: registry/test-plans/TLC-FC-10-VIRTUES-014/test-plan.yaml
