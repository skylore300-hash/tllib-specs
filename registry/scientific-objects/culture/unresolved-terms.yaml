schema_version: 1
domain: culture
status: preserved_unresolved
source: maths/25-culture/culture.md
items:
  - id: TLC-UR-CULTURE-001
    topic: autonomous_cultural_structure
    statement: The chapter defines Culture through C_cultural and C_symbolic inside Context and supplies no autonomous cultural state space, operator, or metric.
    consequence: Do not construct C_culture, A_culture, g_culture, or an equivalent autonomous geometry.
  - id: TLC-UR-CULTURE-002
    topic: uncoordinated_cultural_objects
    statement: Values, beliefs, norms, languages, representations, myths, narratives, figures, and symbolic objects are named but not provided with complete coordinates or measurement maps.
    consequence: Do not invent embeddings, vectors, coordinates, distances, or quantitative scores for these objects.
  - id: TLC-UR-CULTURE-003
    topic: robust_plastic_boundary
    statement: Robust and culturally plastic forms are distinguished by relative contextual sensitivity, but no separation threshold or decision rule is supplied.
    consequence: No local numeric robust/plastic classification is permitted without external scientific evidence.
  - id: TLC-UR-CULTURE-004
    topic: invariant_core_preservation_quantification
    statement: Preservation near the invariant core is asserted under strong penalization in J without a neighborhood radius, minimum penalty coefficient, or quantitative sufficient condition.
    consequence: Do not convert the qualitative preservation statement into a numeric guarantee.
  - id: TLC-UR-CULTURE-005
    topic: cultural_influence_quantification
    statement: Culture is said to act on reception, application, incarnation, and practice, but no effect size, transfer function, or quantitative influence map is defined.
    consequence: Preserve these as qualitative influence surfaces only.
  - id: TLC-UR-CULTURE-006
    topic: cultural_failure_detection
    statement: Ignorance of the milieu and dissolution in the milieu are named as opposite failures, but no observable detector, score, or threshold distinguishes them.
    consequence: Automatic failure-mode detection requires external evidence; no detector is synthesized.
policy:
  preserve_source_limits: true
  context_remains_mathematical_authority: true
  no_silent_completion: true
  no_autonomous_cultural_operator: true
