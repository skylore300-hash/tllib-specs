items:
  - id: TLC-UR-TEMPORALITY-001
    category: fourth_metric_diagonal_notation_preserved
    statement: The fourth diagonal term of g_tau is alpha_4 t_3^3 rather than a t_4-dependent term; the source explicitly requires preserving this notation without correction.
    source_section: '6. Limites et points scientifiques non résolus'
    policy: preserve_t3_cubed_exactly_no_t4_substitution
  - id: TLC-UR-TEMPORALITY-002
    category: metric_positive_definiteness_unjustified
    statement: The source gives no sufficient conditions ensuring that g_tau is symmetric positive definite for admitted coefficients.
    source_section: '6. Limites et points scientifiques non résolus'
    policy: no_metric_distance_certification_without_external_spd_evidence
  - id: TLC-UR-TEMPORALITY-003
    category: temporal_distance_construction_unspecified
    statement: The source describes the intended meaning of temporal distance but supplies no geodesic, norm or other construction that turns g_tau into an executable distance operation.
    source_section: '2. Métrique temporelle'
    policy: no_distance_formula_invented
  - id: TLC-UR-TEMPORALITY-004
    category: temporal_fiber_structure_unconstructed
    statement: A temporal fiber structure is announced but its bundle spaces, projections, fibers and maps are not constructed.
    source_section: '6. Limites et points scientifiques non résolus'
    policy: structural_descriptor_only_no_fiber_construction
  - id: TLC-UR-TEMPORALITY-005
    category: multiscale_state_space_unspecified
    statement: The mathematical space in which the multiscale state X takes values is not constructed.
    source_section: '6. Limites et points scientifiques non résolus'
    policy: opaque_state_values_only
  - id: TLC-UR-TEMPORALITY-006
    category: theta_space_unspecified
