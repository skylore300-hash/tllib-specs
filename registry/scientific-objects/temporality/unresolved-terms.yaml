  - id: TLC-UR-TEMPORALITY-007
    category: interscale_derivative_semantics_unconstructed
    statement: The source does not construct the derivative spaces or operators needed for cross-scale differential semantics.
    source_section: '6. Limites et points scientifiques non résolus'
    policy: supplied_derivative_values_only_no_numerical_differentiation
  - id: TLC-UR-TEMPORALITY-008
    category: scale_fields_unconstructed
